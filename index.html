<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Clock</title>
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="World Clock">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:           #f1f5f9;
    --surface:      #ffffff;
    --surface-2:    #f8fafc;
    --border:       #e2e8f0;
    --border-strong:#cbd5e1;
    --text-1:       #1e293b;
    --text-2:       #64748b;
    --text-3:       #94a3b8;
    --header-bg:    #1e293b;
    --header-text:  rgba(255,255,255,0.88);
    --header-text-2:rgba(255,255,255,0.5);
    --header-btn-bg:rgba(255,255,255,0.07);
    --header-btn-hv:rgba(255,255,255,0.13);
    --work-bg:      rgba(119,130,214,0.12);
    --work-border:  rgba(119,130,214,0.30);
    --work-text:    #6571c1;
    --work-ap:      #7782d6;
    --cur-bg:       rgba(217,164,92,0.15);
    --cur-border:   rgba(217,164,92,0.45);
    --cur-text:     #a07030;
    --cur-ap:       #d9a45c;
    --r-sm:         8px;
    --r-md:         12px;
    --r-lg:         16px;
    --shadow-sm:    0 1px 2px rgba(15,23,42,.05);
    --shadow-md:    0 4px 6px -1px rgba(15,23,42,.07), 0 2px 4px -2px rgba(15,23,42,.05);
    --mono:         'SF Mono', 'Menlo', 'Monaco', monospace;
    --sans:         'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    html:not([data-theme="light"]) {
      --bg:           #0b1220;
      --surface:      #131c2e;
      --surface-2:    #182238;
      --border:       #232f48;
      --border-strong:#2d3b58;
      --text-1:       #e2e8f0;
      --text-2:       #94a3b8;
      --text-3:       #64748b;
      --header-bg:    #0a111e;
      --header-btn-bg:rgba(255,255,255,0.05);
      --header-btn-hv:rgba(255,255,255,0.1);
      --work-bg:      rgba(138,147,220,0.18);
      --work-border:  rgba(138,147,220,0.35);
      --work-text:    #d0d4f0;
      --work-ap:      #b0b8e8;
      --cur-bg:       rgba(224,178,116,0.12);
      --cur-border:   rgba(224,178,116,0.35);
      --cur-text:     #e8b497;
      --cur-ap:       #e0b274;
      --shadow-sm:    0 1px 2px rgba(0,0,0,.3);
      --shadow-md:    0 4px 6px -1px rgba(0,0,0,.35), 0 2px 4px -2px rgba(0,0,0,.3);
    }
  }

  html[data-theme="dark"] {
    --bg:           #0b1220;
    --surface:      #131c2e;
    --surface-2:    #182238;
    --border:       #232f48;
    --border-strong:#2d3b58;
    --text-1:       #e2e8f0;
    --text-2:       #94a3b8;
    --text-3:       #64748b;
    --header-bg:    #0a111e;
    --header-btn-bg:rgba(255,255,255,0.05);
    --header-btn-hv:rgba(255,255,255,0.1);
    --work-bg:      rgba(138,147,220,0.12);
    --work-border:  rgba(138,147,220,0.25);
    --work-text:    #aab0e2;
    --work-ap:      #8a93dc;
    --cur-bg:       rgba(224,178,116,0.12);
    --cur-border:   rgba(224,178,116,0.35);
    --cur-text:     #e8b497;
    --cur-ap:       #e0b274;
    --shadow-sm:    0 1px 2px rgba(0,0,0,.3);
    --shadow-md:    0 4px 6px -1px rgba(0,0,0,.35), 0 2px 4px -2px rgba(0,0,0,.3);
  }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text-1);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    transition: background-color .2s ease, color .2s ease;
  }

  /* ── Header ── */
  header {
    background: var(--header-bg);
    padding: 0 24px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    transition: background-color .2s ease;
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .header-left h1 {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: -0.3px;
    color: var(--header-text);
  }
  .header-updated {
    font-size: 11px;
    font-weight: 500;
    color: var(--header-text-2);
    font-family: var(--mono);
  }
  .header-right { display: flex; align-items: center; gap: 10px; }
  #theme-toggle {
    width: 34px; height: 34px;
    border-radius: 9px;
    border: none;
    background: var(--header-btn-bg);
    color: var(--header-text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    transition: background-color .15s ease;
    padding: 0;
  }
  #theme-toggle:hover { background: var(--header-btn-hv); }

  /* ── Grid container ── */
  #mz-scroll {
    overflow-x: auto;
    padding: 20px 24px 8px;
    -webkit-overflow-scrolling: touch;
  }
  #mz-scroll::-webkit-scrollbar { height: 4px; }
  #mz-scroll::-webkit-scrollbar-track { background: transparent; }
  #mz-scroll::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }

  #mz-grid {
    display: grid;
    grid-template-columns: 160px repeat(24, 42px);
    gap: 3px;
    row-gap: 6px;
    min-width: max-content;
  }

  .mz-sep {
    grid-column: 1 / -1;
    height: 1px;
    background: var(--border);
    margin: 4px 0;
    transition: background-color .2s ease;
  }

  /* ── Info cell (timezone label) ── */
  .ic {
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: var(--r-md);
    padding: 8px 12px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2px;
    position: sticky;
    left: 0;
    z-index: 2;
    box-shadow: -20px 0 0 6px var(--bg);
    transition: background-color .2s ease, border-color .2s ease;
  }
  .ic-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-1);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: -0.2px;
  }
  .ic-meta {
    font-size: 10px;
    color: var(--text-2);
    font-family: var(--mono);
    display: flex;
    align-items: center;
    gap: 5px;
    margin-top: 1px;
  }
  .ic-offset {
    background: var(--surface-2);
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 10px;
    font-weight: 600;
    color: var(--text-3);
    transition: background-color .2s ease;
  }
  .ic-time {
    font-size: 16px;
    font-family: var(--mono);
    font-weight: 700;
    color: var(--text-1);
    margin-top: 3px;
    letter-spacing: -0.5px;
  }

  /* ── Tiles ── */
  .tile {
    border-radius: var(--r-sm);
    border: 1px solid var(--border);
    padding: 6px 2px 5px;
    text-align: center;
    background: var(--surface-2);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 54px;
    transition: background-color .2s ease, border-color .2s ease, opacity .2s ease;
  }
  .tile.night { opacity: 0.35; }
  .tile.work  { background: var(--work-bg); border-color: var(--work-border); }
  .tile.cur   { background: var(--cur-bg);  border-color: var(--cur-border); opacity: 1 !important; box-shadow: 0 0 0 1px var(--cur-border); }
  .tile.col-hover {
    filter: brightness(1.35);
    border-color: var(--border-strong) !important;
    box-shadow: var(--shadow-md);
    opacity: 1 !important;
    position: relative;
    z-index: 1;
  }

  .tile-h {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 700;
    color: var(--text-1);
    line-height: 1;
    display: block;
    letter-spacing: -0.3px;
  }
  .tile-ap {
    font-size: 9px;
    font-weight: 600;
    color: var(--text-3);
    margin-top: 3px;
    display: block;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .tile.work .tile-h  { color: var(--work-text); }
  .tile.work .tile-ap { color: var(--work-ap); }
  .tile.cur  .tile-h  { color: var(--cur-text); font-weight: 800; }
  .tile.cur  .tile-ap { color: var(--cur-ap); }

  /* Date badge tile */
  .tile.date-t { padding: 5px 2px; }
  .date-mon {
    font-size: 8px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-1);
    display: block;
    line-height: 1;
  }
  .date-day {
    font-size: 16px;
    font-weight: 800;
    color: var(--text-1);
    display: block;
    line-height: 1.2;
    letter-spacing: -0.5px;
  }
  .tile.work  .date-mon, .tile.work  .date-day { color: var(--work-text); }
  .tile.cur   .date-mon, .tile.cur   .date-day { color: var(--cur-text); }
  .tile.night .date-mon, .tile.night .date-day { color: var(--text-3); }

  /* ── Legend ── */
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    padding: 14px 24px 20px;
  }
  .leg-item {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 11px;
    font-weight: 500;
    color: var(--text-2);
  }
  .leg-sw {
    width: 20px;
    height: 10px;
    border-radius: 3px;
    border: 1px solid;
    flex-shrink: 0;
  }
  .leg-badge {
    font-size: 10px;
    font-family: var(--mono);
    font-weight: 600;
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    padding: 1px 5px;
    color: var(--text-3);
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>World Clock</h1>
    <span class="header-updated" id="updated"></span>
  </div>
  <div class="header-right">
    <button id="theme-toggle">⏰</button>
  </div>
</header>

<div id="mz-scroll">
  <div id="mz-grid"></div>
</div>

<div class="legend">
  <div class="leg-item">
    <div class="leg-sw" style="background:var(--cur-bg);border-color:var(--cur-border);"></div>Current hour
  </div>
  <div class="leg-item">
    <div class="leg-sw" style="background:var(--work-bg);border-color:var(--work-border);"></div>Business hours (7am–6pm)
  </div>
  <div class="leg-item">
    <div class="leg-sw" style="background:var(--surface-2);border-color:var(--border);opacity:0.4;"></div>Night (9pm–6am)
  </div>
  <div class="leg-item">
    <span class="leg-badge">MAY</span>&nbsp;Midnight / day change
  </div>
</div>

<script>
(function () {
  var ZONES = [
    { tz: 'Australia/Melbourne', name: 'Melbourne',      isHome: true },
    { tz: 'America/New_York',    name: 'Eastern Time',   sep: true   },
    { tz: 'America/Chicago',     name: 'Central Time'               },
    { tz: 'America/Denver',      name: 'Mountain Time'              },
    { tz: 'America/Los_Angeles', name: 'Pacific Time'               },
  ];

  function getUTCOff(tz) {
    var now = new Date();
    var u = new Date(now.toLocaleString('en-US', { timeZone: 'UTC' }));
    var l = new Date(now.toLocaleString('en-US', { timeZone: tz }));
    return (l - u) / 3600000;
  }

  function getHour(d, tz) {
    return parseInt(
      new Intl.DateTimeFormat('en', { timeZone: tz, hour: 'numeric', hour12: false }).format(d)
    ) % 24;
  }

  function getTZAbbr(tz) {
    var s = new Intl.DateTimeFormat('en', { timeZone: tz, timeZoneName: 'short' }).format(new Date());
    return (s.split(', ')[1] || '').trim();
  }

  function fmtShort(d, tz) {
    var s = new Intl.DateTimeFormat('en', {
      timeZone: tz, hour: 'numeric', minute: '2-digit', hour12: true
    }).format(d);
    return s.replace(' AM', 'a').replace(' PM', 'p').replace(':00', '');
  }

  function getMonDay(now, dayShift) {
    var d = new Date(now.getTime() + dayShift * 86400000);
    var mon = new Intl.DateTimeFormat('en', { month: 'short' }).format(d).toUpperCase();
    var day = new Intl.DateTimeFormat('en', { day: 'numeric' }).format(d);
    return { mon: mon, day: day };
  }

  function render() {
    var now = new Date();
    var torOff = getUTCOff('Australia/Melbourne');
    var curCol = getHour(now, 'Australia/Melbourne');
    var html = '';

    ZONES.forEach(function (z, zi) {
      if (z.sep && zi > 0) {
        html += '<div class="mz-sep" style="grid-column:1/-1;"></div>';
      }

      var zOff   = getUTCOff(z.tz);
      var diff   = Math.round(zOff - torOff);
      var offStr = diff === 0 ? '+0h' : (diff > 0 ? '+' + diff + 'h' : diff + 'h');
      var abbr   = getTZAbbr(z.tz);
      var ctime  = fmtShort(now, z.tz);
      var midCol = ((-diff % 24) + 24) % 24;

      html += '<div class="ic' + (z.isHome ? ' home-row' : '') + '">' +
        '<div class="ic-name">' + z.name + '</div>' +
        '<div class="ic-meta">' +
          '<span class="ic-offset">' + (z.isHome ? 'home' : offStr) + '</span>' + abbr +
        '</div>' +
        '<div class="ic-time">' + ctime + '</div>' +
      '</div>';

      for (var col = 0; col < 24; col++) {
        var raw    = col + diff;
        var lh     = ((raw % 24) + 24) % 24;
        var ds     = raw >= 24 ? 1 : (raw < 0 ? -1 : 0);
        var isCur  = col === curCol;
        var isWork = lh >= 7 && lh <= 17;
        var isNight= lh >= 21 || lh < 6;
        var isMid  = (col === midCol) && !z.isHome;

        var cls = 'tile';
        if (isCur)        cls += ' cur';
        else if (isNight) cls += ' night';
        else if (isWork)  cls += ' work';

        if (isMid) {
          cls += ' date-t';
          var md = getMonDay(now, ds);
          html += '<div class="' + cls + '" data-col="' + col + '">' +
            '<span class="date-mon">' + md.mon + '</span>' +
            '<span class="date-day">' + md.day + '</span>' +
          '</div>';
        } else {
          var h12 = lh % 12 || 12;
          var ap  = lh < 12 ? 'am' : 'pm';
          html += '<div class="' + cls + '" data-col="' + col + '">' +
            '<span class="tile-h">' + h12 + '</span>' +
            '<span class="tile-ap">' + ap + '</span>' +
          '</div>';
        }
      }
    });

    document.getElementById('mz-grid').innerHTML = html;

    var scroll = document.getElementById('mz-scroll');
    var tileW  = 45;
    var infoW  = 163;
    scroll.scrollLeft = infoW + curCol * tileW - scroll.offsetWidth / 2 + tileW / 2;

    document.getElementById('updated').textContent =
      now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    applyTheme();
  }

  render();
  setInterval(render, 60000);

  // Service worker — keeps the home screen app up to date
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').then(function(reg) {
      reg.update();
    });
  }

  // Theme: auto (business hours) → light → dark → auto
  var themeBtn = document.getElementById('theme-toggle');

  function applyTheme() {
    var saved = localStorage.getItem('wc-theme');
    if (saved === 'light' || saved === 'dark') {
      document.documentElement.setAttribute('data-theme', saved);
    } else {
      var h = getHour(new Date(), 'Australia/Melbourne');
      document.documentElement.setAttribute('data-theme', (h >= 7 && h <= 17) ? 'light' : 'dark');
    }
  }

  function syncBtn() {
    var saved = localStorage.getItem('wc-theme');
    if (saved === 'light') {
      themeBtn.textContent = '☀️';
      themeBtn.title = 'Light mode — click for dark';
    } else if (saved === 'dark') {
      themeBtn.textContent = '🌙';
      themeBtn.title = 'Dark mode — click for auto';
    } else {
      themeBtn.textContent = '⏰';
      themeBtn.title = 'Auto (business hours) — click for light';
    }
  }

  themeBtn.addEventListener('click', function() {
    var saved = localStorage.getItem('wc-theme');
    if (!saved)          { localStorage.setItem('wc-theme', 'light'); }
    else if (saved === 'light') { localStorage.setItem('wc-theme', 'dark'); }
    else                 { localStorage.removeItem('wc-theme'); }
    applyTheme();
    syncBtn();
  });

  applyTheme();
  syncBtn();

  var grid = document.getElementById('mz-grid');
  grid.addEventListener('mouseover', function(e) {
    var tile = e.target.closest('[data-col]');
    if (!tile) return;
    var col = tile.dataset.col;
    if (grid._hovCol === col) return;
    grid.querySelectorAll('.col-hover').forEach(function(t) { t.classList.remove('col-hover'); });
    grid.querySelectorAll('[data-col="' + col + '"]').forEach(function(t) { t.classList.add('col-hover'); });
    grid._hovCol = col;
  });
  grid.addEventListener('mouseleave', function() {
    grid.querySelectorAll('.col-hover').forEach(function(t) { t.classList.remove('col-hover'); });
    grid._hovCol = null;
  });
})();
</script>
</body>
</html>
